name: Binaries
on:
  release: { types: [published] }
  workflow_dispatch:
    inputs:
      tag: { description: Release tag to attach binaries to, required: true }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64, asset: godaddy-linux-x64 }
          - { target: bun-linux-arm64, asset: godaddy-linux-arm64 }
          - { target: bun-darwin-x64, asset: godaddy-darwin-x64 }
          - { target: bun-darwin-arm64, asset: godaddy-darwin-arm64 }
          - { target: bun-windows-x64, asset: godaddy-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build packages/cli/src/bin.ts --compile --minify --target=${{ matrix.target }} --outfile packages/cli/dist/${{ matrix.asset }}
      - run: cd packages/cli/dist && shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            packages/cli/dist/${{ matrix.asset }}
            packages/cli/dist/${{ matrix.asset }}.sha256
